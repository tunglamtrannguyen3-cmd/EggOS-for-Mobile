name: Build EggOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

     - name: Install Toolchains (Ada & Binutils)
  run: |
    sudo apt-get update
    sudo apt-get install -y gnat gprbuild gcc-aarch64-none-elf binutils-aarch64-none-elf gnat-13-aarch64-none-elf
    sudo ln -sf /usr/bin/aarch64-none-elf-gcc /usr/bin/aarch64-none-elf-gcc
    sudo ln -sf /usr/bin/aarch64-none-elf-gnatmake /usr/bin/aarch64-none-elf-gnatmake
    sudo ln -sf /usr/bin/aarch64-none-elf-gnatbind /usr/bin/aarch64-none-elf-gnatbind
    sudo ln -sf /usr/bin/aarch64-none-elf-gnatlink /usr/bin/aarch64-none-elf-gnatlink
    sudo ln -sf /usr/bin/aarch64-none-elf-gnat /usr/bin/aarch64-none-elf-gnat
      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none

      - name: Build EggOS
        run: make CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Raw Binary
        uses: actions/upload-artifact@v4
        with:
          name: eggos-binary
          path: build/eggos.bin
          if-no-files-found: error
