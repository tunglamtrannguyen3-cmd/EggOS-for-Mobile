name: Build EggOS

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            curl \
            ca-certificates \
            gnat \
            gprbuild

      - name: Set up Alire (Ada/SPARK Package Manager)
        uses: alire-project/setup-alire@latest

      - name: Install ARM bare-metal GNU toolchain
        run: |
          set -eux
          mkdir -p /opt/arm-gnu
          curl -L \
            -o /tmp/arm-gnu-toolchain.tar.xz \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-elf.tar.xz"
          tar -C /opt/arm-gnu -xJf /tmp/arm-gnu-toolchain.tar.xz --strip-components=1
          echo "/opt/arm-gnu/bin" >> "$GITHUB_PATH"

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none

      - name: Build Ada/SPARK Components
        run: |
          set -eux
          gprbuild -P eggos.gpr

      - name: Build phone image
        run: |
          set -eux
          make CROSS_COMPILE=aarch64-none-elf- -j"$(nproc)"
          cp build/eggos.elf build/eggos-phone.elf
          cp build/eggos.bin build/eggos-phone.bin
          ls -lh build/eggos-phone.bin
          test -f build/eggos-phone.bin

      - name: Build QEMU image
        run: |
          set -eux
          make CROSS_COMPILE=aarch64-none-elf- BOARD=qemu -j"$(nproc)"
          cp build/eggos.elf build/eggos-qemu.elf
          cp build/eggos.bin build/eggos-qemu.bin
          ls -lh build/eggos-qemu.bin
          test -f build/eggos-qemu.bin

      - name: Upload phone binary
        uses: actions/upload-artifact@v4
        with:
          name: eggos-phone
          path: |
            build/eggos-phone.elf
            build/eggos-phone.bin
          if-no-files-found: error

      - name: Upload QEMU binary
        uses: actions/upload-artifact@v4
        with:
          name: eggos-qemu
          path: |
            build/eggos-qemu.elf
            build/eggos-qemu.bin
          if-no-files-found: error