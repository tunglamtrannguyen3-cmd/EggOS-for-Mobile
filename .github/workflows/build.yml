name: Build EggOS

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            curl \
            ca-certificates

      - name: Set up Alire (Ada/SPARK Package Manager)
        uses: alire-project/setup-alire@latest

      - name: Install ARM bare-metal GNU toolchain
        run: |
          set -eux
          mkdir -p /opt/arm-gnu
          curl -L \
            -o /tmp/arm-gnu-toolchain.tar.xz \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-elf.tar.xz"
          tar -C /opt/arm-gnu -xJf /tmp/arm-gnu-toolchain.tar.xz --strip-components=1
          echo "/opt/arm-gnu/bin" >> "$GITHUB_PATH"

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none

      - name: Build Ada/SPARK Components
        run: |
          set -eux
          gprbuild -P eggos.gpr

      - name: Build EggOS
        run: |
          set -eux
          which aarch64-none-elf-gcc
          which aarch64-none-elf-ld
          make CROSS_COMPILE=aarch64-none-elf- -j"$(nproc)"
          ls -lh build
          test -f build/eggos.bin

      - name: Upload Raw Binary
        uses: actions/upload-artifact@v4
        with:
          name: eggos-binary
          path: build/eggos.bin
          if-no-files-found: error